<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowCRM AI Company · 沙盘演示</title>
<style>
  /* ── Reset & Base ──────────────────────────────────────────────── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    /* Kenney "Modular Space Kit" color palette */
    --kenney-purple: #9F94C5;
    --kenney-purple-dark: #7E72B0;
    --kenney-orange: #F08030;
    --kenney-orange-bright: #FF8C42;
    --kenney-floor: #2E3038;
    --kenney-floor-light: #3C3F4A;
    --kenney-door: #2A2D35;
    background: var(--kenney-floor);
    color: #E8E6F0;
    display: flex;
    flex-direction: column;
    user-select: none;
    overflow: hidden;
  }
  button { font-family: inherit; }

  /* ── Header ─────────────────────────────────────────────────────── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 18px;
    background: rgba(20, 22, 28, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(240, 128, 48, 0.3);
    z-index: 100;
    flex-shrink: 0;
    height: 44px;
  }
  #header h1 {
    font-size: 14px;
    font-weight: 600;
    color: white;
    letter-spacing: 0.5px;
  }
  #header h1 .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--kenney-orange);
    margin: 0 6px;
    animation: live-dot 1.5s ease-in-out infinite;
    box-shadow: 0 0 6px var(--kenney-orange);
  }
  @keyframes live-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  #stats { display: flex; gap: 14px; font-size: 11px; color: #A8A4C2; }
  #stats span { display: inline-flex; align-items: center; gap: 4px; }
  #stats b { color: white; font-weight: 600; font-variant-numeric: tabular-nums; }
  .controls { display: flex; gap: 6px; }
  .controls button {
    padding: 4px 12px;
    border-radius: 4px;
    border: 1px solid rgba(240, 128, 48, 0.4);
    background: rgba(255, 255, 255, 0.05);
    color: white;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .controls button:hover { background: rgba(240, 128, 48, 0.2); }
  .controls button.primary {
    background: var(--kenney-orange);
    color: white;
    border-color: var(--kenney-orange);
  }
  .controls button.primary:hover { background: var(--kenney-orange-bright); }

  /* ── Input panel (top, above sandbox) ─────────────────────── */
  #input-panel {
    background: rgba(20, 22, 28, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(240, 128, 48, 0.3);
    flex-shrink: 0;
  }
  .input-header {
    padding: 6px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    height: 30px;
  }
  .input-header:hover { background: rgba(240, 128, 48, 0.05); }
  .input-icon { font-size: 13px; }
  .input-title { color: white; font-size: 12px; font-weight: 600; }
  .input-hint { color: #A8A4C2; font-size: 10px; margin-left: 4px; }
  .toggle-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: #A8A4C2;
    cursor: pointer;
    font-size: 10px;
  }
  .input-body {
    padding: 10px 18px 12px;
    max-height: 280px;
    overflow-y: auto;
    transition: max-height 0.3s;
  }
  #input-panel.collapsed .input-body { display: none; }
  #input-panel.collapsed .input-hint { display: inline; }
  #task-input {
    width: 100%;
    min-height: 60px;
    padding: 8px 10px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(240, 128, 48, 0.3);
    border-radius: 4px;
    color: #E8E6F0;
    font-family: inherit;
    font-size: 12px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
  }
  #task-input:focus { border-color: var(--kenney-orange); }
  .input-meta {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
    font-size: 10px;
    color: #A8A4C2;
  }
  .input-meta label {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 6px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 3px;
  }
  .input-meta input {
    width: 90px;
    padding: 2px 4px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(240, 128, 48, 0.2);
    border-radius: 2px;
    color: white;
    font-size: 10px;
    font-family: inherit;
    outline: none;
  }
  .input-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .input-actions button {
    padding: 5px 12px;
    border-radius: 3px;
    border: 1px solid rgba(240, 128, 48, 0.3);
    background: rgba(255, 255, 255, 0.05);
    color: white;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .input-actions button:hover { background: rgba(240, 128, 48, 0.15); }
  .input-actions button.primary {
    background: var(--kenney-orange);
    border-color: var(--kenney-orange);
    font-weight: 600;
  }
  .input-actions button.primary:hover { background: var(--kenney-orange-bright); }
  .parsed-summary {
    margin-top: 8px;
    padding: 6px 10px;
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.3);
    border-radius: 4px;
    font-size: 11px;
    color: #6EE7B7;
    display: none;
  }
  .parsed-summary.show { display: block; }
  .parsed-summary strong { color: white; }

  /* ── Floating chat windows (pop-up from conv-item click) ─── */
  .chat-window {
    position: fixed;
    width: 360px;
    height: 320px;
    background: rgba(20, 22, 28, 0.97);
    backdrop-filter: blur(14px);
    border: 1px solid var(--kenney-orange);
    border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    z-index: 200;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: chat-window-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes chat-window-in {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
  .chat-window-header {
    padding: 8px 12px;
    background: linear-gradient(180deg, rgba(240, 128, 48, 0.2) 0%, rgba(240, 128, 48, 0.05) 100%);
    border-bottom: 1px solid rgba(240, 128, 48, 0.4);
    display: flex;
    align-items: center;
    gap: 6px;
    color: white;
    font-size: 11px;
    font-weight: 600;
    cursor: move;
    user-select: none;
  }
  .chat-window-header .close-btn {
    margin-left: auto;
    background: rgba(0, 0, 0, 0.3);
    border: none;
    color: #A8A4C2;
    cursor: pointer;
    width: 20px;
    height: 20px;
    border-radius: 3px;
    font-size: 13px;
  }
  .chat-window-header .close-btn:hover { background: rgba(240, 128, 48, 0.3); color: white; }
  .chat-window-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .chat-window-body .message { max-width: 95%; }

  /* ── Main scene (sandbox + floating panels) ────────────────── */
  #main {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  /* ── Office sandbox (the main view) ─────────────────────────── */
  #office {
    position: absolute;
    inset: 0;
    /* Floor pattern using kenney floor color */
    background-color: var(--kenney-floor);
    background-image:
      radial-gradient(circle at 30% 30%, rgba(240, 128, 48, 0.06), transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(159, 148, 197, 0.06), transparent 50%),
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: cover, cover, 40px 40px, 40px 40px;
    overflow: hidden;
  }

  /* Energy conduits (decorative orange lines on walls) */
  .conduit {
    position: absolute;
    background: linear-gradient(90deg, transparent, var(--kenney-orange), transparent);
    height: 2px;
    box-shadow: 0 0 8px rgba(240, 128, 48, 0.5);
    z-index: 1;
    pointer-events: none;
  }
  .conduit.vertical {
    width: 2px;
    height: 100%;
    background: linear-gradient(180deg, transparent, var(--kenney-orange), transparent);
  }
  .conduit.top { top: 8%; left: 0; right: 0; }
  .conduit.bottom { bottom: 8%; left: 0; right: 0; }

  /* Wall sections (decorative top + bottom bars) */
  .wall-bar {
    position: absolute;
    left: 0;
    right: 0;
    height: 24px;
    background: linear-gradient(180deg, var(--kenney-purple) 0%, var(--kenney-purple-dark) 100%);
    border-bottom: 2px solid var(--kenney-orange);
    z-index: 2;
    pointer-events: none;
  }
  .wall-bar.top { top: 0; }
  .wall-bar.bottom { bottom: 0; border-bottom: none; border-top: 2px solid var(--kenney-orange); }
  .wall-bar::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 0;
    right: 0;
    height: 4px;
    background: rgba(240, 128, 48, 0.3);
  }
  .wall-bar.bottom::after { bottom: auto; top: -8px; }

  /* Floor tile decoration */
  .floor-tile {
    position: absolute;
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, rgba(60, 63, 74, 0.4) 0%, rgba(46, 48, 56, 0.4) 100%);
    border: 1px solid rgba(159, 148, 197, 0.15);
    border-radius: 4px;
    pointer-events: none;
  }

  /* Desks (top-down view) */
  .desk {
    position: absolute;
    width: 70px;
    height: 50px;
    background: linear-gradient(180deg, #6B7280 0%, #4B5563 100%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    transition: all 0.3s;
    pointer-events: none;
    z-index: 3;
  }
  .desk::before {
    content: '';
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 32px;
    height: 20px;
    background: linear-gradient(135deg, #1F2937 0%, #111827 100%);
    border: 1px solid var(--kenney-orange);
    border-radius: 2px;
    box-shadow: 0 0 6px rgba(240, 128, 48, 0.4);
  }
  .desk::after {
    content: '';
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 4px;
    background: rgba(240, 128, 48, 0.3);
    border-radius: 2px;
  }
  /* Desk has glow when its occupant is talking */
  .desk.active {
    box-shadow: 0 0 16px rgba(240, 128, 48, 0.6), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  /* Meeting table (round, central) */
  .meeting-table {
    position: absolute;
    width: 130px;
    height: 130px;
    background: radial-gradient(circle, rgba(240, 128, 48, 0.15) 0%, transparent 70%);
    border: 3px dashed rgba(240, 128, 48, 0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.5s;
    z-index: 3;
    pointer-events: none;
  }
  .meeting-table::before {
    content: '';
    position: absolute;
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, var(--kenney-purple) 0%, var(--kenney-purple-dark) 100%);
    border: 2px solid var(--kenney-orange);
    border-radius: 50%;
    box-shadow: 0 0 16px rgba(240, 128, 48, 0.4);
  }
  .meeting-table.active {
    border-style: solid;
    border-color: var(--kenney-orange);
    background: radial-gradient(circle, rgba(240, 128, 48, 0.25) 0%, transparent 70%);
    box-shadow: 0 0 40px rgba(240, 128, 48, 0.5);
  }
  .meeting-table .meeting-label {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    padding: 3px 10px;
    background: rgba(20, 22, 28, 0.95);
    border: 1px solid var(--kenney-orange);
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    color: var(--kenney-orange-bright);
    white-space: nowrap;
    z-index: 5;
  }

  /* Meeting topic floating card (会议室议题浮卡) */
  .meeting-topic {
    position: absolute;
    top: -56px;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 14px;
    background: rgba(240, 128, 48, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 16px;
    font-size: 11px;
    font-weight: 600;
    color: white;
    white-space: nowrap;
    z-index: 6;
    box-shadow: 0 4px 16px rgba(240, 128, 48, 0.4);
    animation: topic-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }
  .meeting-topic .topic-icon {
    margin-right: 4px;
    font-size: 12px;
  }
  .meeting-topic::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: rgba(240, 128, 48, 0.95);
  }
  @keyframes topic-in {
    from { opacity: 0; transform: translate(-50%, -8px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  /* Decorative plants / coffee / window */
  .deco {
    position: absolute;
    font-size: 28px;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    pointer-events: none;
    z-index: 4;
  }

  /* ── Characters (SVG-based, larger & more visible) ─────────── */
  .character {
    position: absolute;
    left: 0;
    top: 0;
    width: 96px;
    height: 128px;
    transform: translate(-50%, -100%);
    transition: left 1.5s cubic-bezier(0.4, 0, 0.2, 1),
                top 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 10;
    cursor: pointer;
  }
  .character.hidden { opacity: 0; pointer-events: none; }
  .character.selected .char-svg { filter: drop-shadow(0 0 8px var(--kenney-orange)); }
  .character.spawning .char-svg { animation: spawn-in 0.8s ease-out; }
  @keyframes spawn-in {
    0% { opacity: 0; transform: translateY(-30px) scale(0.6); }
    60% { transform: translateY(8px) scale(1.05); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .char-svg {
    width: 100%;
    height: 100%;
    display: block;
    transition: transform 0.3s;
  }

  /* Character states via SVG animation */
  @keyframes char-idle-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .character[data-state="idle"] .char-svg { animation: char-idle-bob 3s ease-in-out infinite; }

  @keyframes char-talk-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .character[data-state="talking"] .char-svg { animation: char-talk-bob 0.4s ease-in-out infinite; }
  .character[data-state="talking"] .mouth-shape { animation: mouth-talk 0.3s ease-in-out infinite; }
  @keyframes mouth-talk { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.5); } }

  @keyframes char-walk-bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-2px) rotate(2deg); } }
  .character[data-state="walking"] .char-svg { animation: char-walk-bob 0.3s ease-in-out infinite; }

  @keyframes char-think { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2px) rotate(-3deg); } }
  .character[data-state="thinking"] .char-svg { animation: char-think 2s ease-in-out infinite; }

  @keyframes char-work { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .character[data-state="working"] .char-svg { animation: char-work 0.8s ease-in-out infinite; }

  .character[data-state="done"] .char-svg { animation: char-celebrate 0.6s ease-out; }
  @keyframes char-celebrate { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }

  /* Head speech bubble - position absolute so it follows character movement */
  .head-bubble {
    position: absolute;
    left: 50%;
    top: 0;
    background: rgba(255, 255, 255, 0.98);
    color: #1c1917;
    border: 2px solid var(--kenney-orange);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 500;
    white-space: normal;
    width: 240px;
    min-width: 240px;
    max-width: 280px;
    word-break: break-word;
    line-height: 1.45;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 150;
    transform: translate(-50%, calc(-100% - 4px));
  }
  .head-bubble.show {
    opacity: 1;
  }
  .head-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: white;
  }
  .head-bubble::before {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: var(--kenney-orange);
    z-index: -1;
  }
  .head-bubble.show {
    opacity: 1;
  }
  .head-bubble.thinking {
    border-color: var(--kenney-purple);
  }

  /* Status LED on character */
  .status-pip {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 6px currentColor;
    z-index: 15;
  }
  .character[data-state="thinking"] .status-pip { background: #eab308; animation: led-pulse 1s ease-in-out infinite; }
  .character[data-state="talking"] .status-pip { background: #f08030; }
  .character[data-state="walking"] .status-pip { background: #60a5fa; }
  .character[data-state="working"] .status-pip { background: #a78bfa; animation: led-pulse 1s ease-in-out infinite; }
  .character[data-state="done"] .status-pip { background: #10b981; }
  @keyframes led-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.7); opacity: 0.5; } }

  /* ── Floating panels (overlay on sandbox) ──────────────────── */
  .floating-panel {
    position: absolute;
    background: rgba(20, 22, 28, 0.92);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(240, 128, 48, 0.3);
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    z-index: 50;
    display: flex;
    flex-direction: column;
    transition: all 0.3s;
    overflow: hidden;
  }
  .floating-panel.collapsed {
    height: auto !important;
  }
  .floating-panel.collapsed .panel-body {
    display: none;
  }
  .panel-header {
    padding: 8px 12px;
    background: rgba(240, 128, 48, 0.1);
    border-bottom: 1px solid rgba(240, 128, 48, 0.3);
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: white;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
  }
  .panel-header .toggle {
    margin-left: auto;
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .panel-header .toggle:hover { background: rgba(255, 255, 255, 0.1); }
  .panel-body {
    flex: 1;
    overflow-y: auto;
  }

  /* Chat panel - top right */
  #activity-panel {
    top: 60px;
    right: 12px;
    width: 340px;
    height: 380px;
  }
  #activity-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 100%;
    overflow-y: auto;
  }
  .activity-row {
    padding: 6px 8px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 4px;
    border-left: 2px solid var(--kenney-orange);
    font-size: 11px;
    color: #E8E6F0;
    line-height: 1.4;
    animation: act-in 0.3s ease-out;
  }
  @keyframes act-in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  .activity-row .actor {
    color: var(--kenney-orange-bright);
    font-weight: 600;
    margin-right: 4px;
  }
  .activity-row .time {
    color: #6B7280;
    font-size: 9px;
    margin-left: 4px;
  }
  .activity-row .text {
    color: #C8C4DC;
  }
  #chat-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #chat-messages {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .message {
    display: flex;
    gap: 6px;
    max-width: 90%;
    animation: msg-in 0.3s ease-out;
  }
  @keyframes msg-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .message.from-self { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--avatar-color, #4B5563);
    color: white;
    display: flex;
    align-items: center;

        <line x1="61" y1="86" x2="64" y2="86" stroke="#dc2626" stroke-width="1"/>
        <line x1="56" y1="84" x2="54" y2="82" stroke="#dc2626" stroke-width="1"/>
        <line x1="60" y1="84" x2="62" y2="82" stroke="#dc2626" stroke-width="1"/>
        <line x1="56" y1="88" x2="54" y2="90" stroke="#dc2626" stroke-width="1"/>
        <line x1="60" y1="88" x2="62" y2="90" stroke="#dc2626" stroke-width="1"/>
        <!-- Test pass badge on left chest -->
        <circle cx="38" cy="88" r="4" fill="none" stroke="#10b981" stroke-width="1"/>
        <path d="M35 88 L37 90 L41 86" stroke="#10b981" stroke-width="1.2" fill="none"/>
        <!-- Arms -->
        <path d="M20 74 L26 76 L24 108 L18 106 Z" fill="url(#tester-grad)"/>
        <path d="M76 74 L70 76 L72 108 L78 106 Z" fill="url(#tester-grad)"/>
        <!-- Hands -->
        <ellipse cx="22" cy="106" rx="4" ry="3" fill="url(#tester-skin)"/>
        <ellipse cx="74" cy="106" rx="4" ry="3" fill="url(#tester-skin)"/>
        <!-- Clipboard in left hand -->
        <rect x="10" y="92" width="14" height="22" rx="1" fill="#fef3c7" stroke="#92400e" stroke-width="0.8"/>
        <rect x="14" y="89" width="6" height="4" rx="1" fill="#9ca3af"/>
        <line x1="13" y1="98" x2="21" y2="98" stroke="#6b7280" stroke-width="0.5"/>
        <line x1="13" y1="102" x2="20" y2="102" stroke="#10b981" stroke-width="0.8"/>
        <line x1="13" y1="106" x2="21" y2="106" stroke="#6b7280" stroke-width="0.5"/>
        <line x1="13" y1="110" x2="19" y2="110" stroke="#dc2626" stroke-width="0.8"/>
        <!-- Magnifying glass in right hand -->
        <circle cx="78" cy="94" r="6" fill="rgba(255,255,255,0.15)" stroke="#1f2937" stroke-width="2"/>
        <line x1="82" y1="98" x2="88" y2="104" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="84" y1="100" x2="86" y2="102" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
        <!-- Glass shine -->
        <ellipse cx="76" cy="92" rx="2" ry="1" fill="white" opacity="0.6"/>
        <!-- Neck -->
        <rect x="44" y="60" width="8" height="14" fill="url(#tester-skin)"/>
        <!-- Head -->
        <ellipse cx="48" cy="38" rx="20" ry="22" fill="url(#tester-skin)" stroke="#d4a373" stroke-width="0.8"/>
        <!-- Hair (short, neat, dark) -->
        <path d="M30 28 Q30 14 42 10 Q50 8 56 10 Q66 14 66 28 Q66 24 62 22 Q54 20 48 20 Q42 20 34 22 Q30 24 30 28 Z" fill="#451a03"/>
        <!-- Side burns -->
        <path d="M30 38 Q28 44 30 50" fill="#451a03"/>
        <path d="M66 38 Q68 44 66 50" fill="#451a03"/>
        <!-- Eyebrows (focused, thick) -->
        <path d="M38 32 L46 31" stroke="#451a03" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M50 31 L58 32" stroke="#451a03" stroke-width="1.6" stroke-linecap="round"/>
        <!-- Eyes (sharp, focused) -->
        <ellipse cx="42" cy="36" rx="3" ry="2" fill="white"/>
        <ellipse cx="54" cy="36" rx="3" ry="2" fill="white"/>
        <circle cx="42" cy="36" r="1.5" fill="#1f2937"/>
        <circle cx="54" cy="36" r="1.5" fill="#1f2937"/>
        <!-- Nose -->
        <path d="M48 38 Q46 44 48 46 Q50 44 48 38" fill="none" stroke="#d4a373" stroke-width="0.8"/>
        <!-- Mouth (small smile, careful) -->
        <path class="mouth-shape" d="M44 50 Q48 51.5 52 50" fill="none" stroke="#1f2937" stroke-width="1"/>
        <!-- Earring -->
        <circle cx="32" cy="48" r="1.2" fill="#fbbf24"/>
      </svg>
    </div>
  </div>

  <!-- Activity stream panel (top right) - replaces redundant chat panel -->
  <div class="floating-panel" id="activity-panel">
    <div class="panel-header" onclick="togglePanel('activity-panel')">
      ⚡ <span>实时活动</span> <span id="activity-count" style="color: var(--kenney-orange); font-weight: 400;">(0)</span>
      <button class="toggle" onclick="event.stopPropagation(); togglePanel('activity-panel')">_</button>
    </div>
    <div class="panel-body">
      <div id="activity-list" style="padding: 6px;"></div>
    </div>
  </div>

  <!-- Floating conversations list (bottom left) -->
  <div class="floating-panel" id="conv-panel">
    <div class="panel-header" onclick="togglePanel('conv-panel')">
      💬 对话列表 <span style="color: var(--kenney-orange); font-weight: 400;" id="conv-total">(0)</span>
      <button class="toggle" onclick="event.stopPropagation(); togglePanel('conv-panel')">_</button>
    </div>
    <div class="panel-body">
      <div id="conv-list"></div>
    </div>
  </div>

  <!-- Floating deliverables panel (bottom right) -->
  <div class="floating-panel" id="deliv-panel">
    <div class="panel-header" onclick="togglePanel('deliv-panel')">
      📦 成果库 <span style="color: var(--kenney-orange); font-weight: 400;" id="deliv-total">(0)</span>
      <button class="toggle" onclick="event.stopPropagation(); togglePanel('deliv-panel')">_</button>
    </div>
    <div class="panel-body">
      <div id="deliv-list"></div>
    </div>
  </div>
</div>

<!-- Character detail slide-in panel -->
<div id="character-detail">
  <div class="detail-header">
    <div class="detail-avatar" id="detail-avatar">董</div>
    <div>
      <div class="detail-name" id="detail-name">董事长</div>
      <div class="detail-role" id="detail-role">战略层</div>
    </div>
    <button class="detail-close" id="detail-close">×</button>
  </div>
  <div class="detail-section">
    <h4>当前状态</h4>
    <div><span class="detail-state-badge" id="detail-state">空闲</span></div>
  </div>
  <div class="detail-section">
    <h4>当前任务 / 发言</h4>
    <div class="item" id="detail-task">—</div>
  </div>
  <div class="detail-section">
    <h4>参与对话</h4>
    <div id="detail-conversations"></div>
  </div>
  <div class="detail-section">
    <h4>产出物</h4>
    <div id="detail-deliverables"></div>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
